name: Linux backend foundation

on:
  push:
    branches: [main, backend/linux]
    paths:
      - 'backend/**'
      - 'scripts/backend-doctor.sh'
      - 'src/backend-contract.ts'
      - '.github/workflows/backend-linux.yml'
  pull_request:
    branches: [main, backend/linux]
    paths:
      - 'backend/**'
      - 'scripts/backend-doctor.sh'
      - 'src/backend-contract.ts'
      - '.github/workflows/backend-linux.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake ninja-build python3 gdb libc6-dbg
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install standalone TypeScript contract checker
        run: npm install --global typescript@5.9.3
      - name: Check environment script syntax
        run: bash -n scripts/backend-doctor.sh
      - name: Configure
        working-directory: backend
        run: cmake --preset linux-debug
      - name: Build
        working-directory: backend
        run: cmake --build --preset linux-debug
      - name: Test backend and frontend DTO conformance
        working-directory: backend
        run: ctest --preset linux-debug
      - name: Build and execute the recorder fixture normally
        working-directory: backend
        run: |
          cmake --build --preset linux-debug --target phantom-rr-fixture
          ./out/linux-debug/phantom-rr-fixture
      # rr record/replay requires a separately verified CPU/PMU configuration.
      # This job validates Linux compilation, not recorder capability.

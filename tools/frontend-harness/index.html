<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phantom backend harness</title><link rel="stylesheet" href="/style.css"></head><body><header><div><h1>Phantom backend harness</h1><p>Минимальный стенд реального GDB backend. Все действия идут через stdio NDJSON.</p></div><div id="connection" class="badge">не подключено</div></header><main><section class="controls"><label>Исходник <textarea id="source">#include &lt;iostream&gt;
int main() {
  int value = 40;
  std::cout &lt;&lt; "ready\n";
  ++value;
  std::cerr &lt;&lt; "diagnostic\n";
  return value;
}</textarea></label><div class="grid"><label>Аргументы<textarea id="argv"></textarea></label><label>stdin<textarea id="input">hello\n</textarea></label><label>Environment<textarea id="environment">PHANTOM_HARNESS=1</textarea></label></div><div class="buttons"><button data-action="build">Build</button><button data-action="launch">Launch</button><button data-action="step">Step</button><button data-action="continue">Continue</button><button data-action="pause">Pause</button><button data-action="stop">Stop</button><button data-action="state">Get state</button><button data-action="history">History</button><button id="reset">Restart backend</button></div><pre id="status">Подключитесь кнопкой Build или Launch.</pre></section><section class="panels"><article><h2>State</h2><pre id="state">—</pre></article><article><h2>Observation</h2><pre id="observation">—</pre></article><article><h2>stdout</h2><pre id="stdout">—</pre></article><article><h2>stderr / errors</h2><pre id="stderr">—</pre></article><article class="wide"><h2>Wire and event log</h2><pre id="log"></pre></article></section></main><script type="module" src="/app.js"></script></body></html>
